<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator console (test mode) — Opportunity Registry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><nav id="site-nav" aria-label="Main"></nav></header>
  <main>
    <h1>Operator console (test mode)</h1>
    <p>
      Test mode lists unused sign-in codes here so testers can sign in as accounts that have no
      real inbox. It stands in for email and is not a production feature.
    </p>
    <button type="button" id="refresh">Refresh</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">Email</th><th scope="col">Code</th><th scope="col">Expires</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="common.js"></script>
  <script src="operator.js"></script>
</body>
</html>
