<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student — Opportunity Registry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><nav id="site-nav" aria-label="Main"></nav></header>
  <main>
    <article id="profile-view" hidden aria-labelledby="student-name">
      <p class="kind">Student</p>
      <h1 id="student-name"></h1>
      <p id="audience" class="hint" hidden>Shown only to people signed in with an Algoma account.</p>
      <section aria-labelledby="work-heading">
        <h2 id="work-heading">Completed work</h2>
        <ul id="outcomes" class="cards"></ul>
      </section>
    </article>

    <section id="not-found" hidden>
      <h1>Student not found</h1>
      <p id="not-found-text"></p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="common.js"></script>
  <script src="outcome-card.js"></script>
  <script src="student.js"></script>
</body>
</html>
