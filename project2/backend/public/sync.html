<!doctype html>
<html lang="en">
<head>

  <title>External sync — Opportunity Registry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><nav id="site-nav" aria-label="Main"></nav></header>

    <h1 id="sync-heading" tabindex="-1">External sources: sync health</h1>

  <script src="common.js"></script>
  <script src="sync.js"></script>
